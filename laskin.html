<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/laskin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

<div class="container">

    <fieldset>
        <legend>
            <h2><i class="bi bi-calculator"></i> Laskin</h2>
        </legend>
        
        <div class="inputs">
            <button onclick="decrease('numA')">-</button>
            <input id="numA" type="number" min="1" max="10" required>
            <button onclick="increase('numA')">+</button>
        

            <select id="operation">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>

            <button onclick="decrease('numB')">-</button>
            <input id="numB" type="number" min="1" max="10" required>
            <button onclick="increase('numB')">+</button>
        </div>


        <button id="calcBtn" onclick="calculate()">Laske</button>

        <div id="resultBox">
            <span id="result"></span>
        </div>

        <div id="historyBox">
            <strong>laskutoimituksia:</strong> <span id="count">0 kpl</span>
            <div id="history"></div>
        </div>

        <script src="js/laskin.js"></script>

    </fieldset>
</body>
</html>
